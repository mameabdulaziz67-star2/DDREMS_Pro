<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Property Listings - DDREMS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; padding: 40px 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 { font-size: 2rem; margin-bottom: 10px; color: #1a1a2e; }
    .subtitle { color: #666; margin-bottom: 40px; }
    .properties-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; }
    .property-card {
      background: white; border-radius: 20px; overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .property-card:hover { transform: translateY(-5px); box-shadow: 0 20px 40px rgba(0,0,0,0.15); }
    .card-image {
      width: 100%; height: 220px; background: #1a1a2e;
      display: flex; align-items: center; justify-content: center;
      color: white; overflow: hidden;
    }
    .card-image img { width: 100%; height: 100%; object-fit: cover; }
    .card-image .fallback { font-size: 56px; opacity: 0.5; }
    .card-content { padding: 20px; }
    .card-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 6px; color: #1a1a2e; }
    .card-price { font-size: 1.2rem; font-weight: bold; color: #3b82f6; margin-bottom: 6px; }
    .card-address { color: #666; font-size: 0.85rem; margin-bottom: 16px; }
    .view-btn {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white; border: none; padding: 11px 20px;
      border-radius: 10px; cursor: pointer; font-weight: 600;
      width: 100%; font-size: 0.95rem; transition: opacity 0.2s;
    }
    .view-btn:hover { opacity: 0.88; }
    .badge {
      display: inline-block; background: #e0e7ff; color: #3b82f6;
      padding: 3px 10px; border-radius: 20px; font-size: 0.7rem;
      font-weight: 600; margin-bottom: 8px;
    }
    .status-msg { text-align: center; padding: 60px; color: #666; font-size: 1.1rem; }
    .error-msg { text-align: center; padding: 60px; color: #e53e3e; }
  </style>
</head>
<body>
  <div class="container">
    <h1>&#127968; Available Properties</h1>
    <p class="subtitle">Click "View 3D Tour" to explore any property in 360&deg;</p>
    <div class="properties-grid" id="grid">
      <div class="status-msg">Loading properties...</div>
    </div>
  </div>

  <script>
    var API_BASE = window.location.origin;

    function formatPrice(price) {
      var n = Number(price);
      if (!price && price !== 0 || isNaN(n)) return 'Price on request';
      return '$' + n.toLocaleString();
    }

    function escapeHtml(str) {
      return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    async function loadProperties() {
      var grid = document.getElementById('grid');
      try {
        var res = await fetch(API_BASE + '/api/properties');
        if (!res.ok) throw new Error('Server returned ' + res.status);
        var data = await res.json();
        var properties = Array.isArray(data) ? data : [];

        if (!properties.length) {
          grid.innerHTML = '<div class="status-msg">No properties found.</div>';
          return;
        }

        grid.innerHTML = '';
        properties.forEach(function(p) {
          var card = document.createElement('div');
          card.className = 'property-card';
          var imgHtml = p.main_image
            ? '<img src="' + escapeHtml(p.main_image) + '" alt="' + escapeHtml(p.title) + '" onerror="this.parentNode.innerHTML=\'<span class=fallback>&#127968;</span>\'" />'
            : '<span class="fallback">&#127968;</span>';
          card.innerHTML =
            '<div class="card-image">' + imgHtml + '</div>' +
            '<div class="card-content">' +
              '<div class="badge">3D Tour Available</div>' +
              '<div class="card-title">' + escapeHtml(p.title || 'Untitled Property') + '</div>' +
              '<div class="card-price">' + formatPrice(p.price) + '</div>' +
              '<div class="card-address">' + escapeHtml(p.location || 'Location not specified') + '</div>' +
              '<button class="view-btn" data-id="' + p.id + '">&#128269; View 3D Tour</button>' +
            '</div>';
          grid.appendChild(card);
        });

        grid.querySelectorAll('.view-btn').forEach(function(btn) {
          btn.addEventListener('click', function() {
            window.location.href = 'index.html?property=' + btn.dataset.id;
          });
        });
      } catch (err) {
        grid.innerHTML = '<div class="error-msg">Failed to load properties: ' + escapeHtml(err.message) + '</div>';
      }
    }

    loadProperties();
  </script>
</body>
</html>
